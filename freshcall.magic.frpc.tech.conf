server {
    if ($host = freshcall.magic.frpc.tech) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name freshcall.magic.frpc.tech;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name freshcall.magic.frpc.tech;
    ssl_certificate /etc/letsencrypt/live/freshcall.magic.frpc.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/freshcall.magic.frpc.tech/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Prevent nginx from dropping long-lived WebSocket connections
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_connect_timeout 60s;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
